name: LinkFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install gateway dependencies
        working-directory: backend/gateway
        run: npm ci

      - name: Install auth dependencies
        working-directory: backend/services/auth
        run: npm ci

      - name: Install URL dependencies
        working-directory: backend/services/url
        run: npm ci

      - name: Install redirect dependencies
        working-directory: backend/services/redirect
        run: npm ci

      - name: Install analytics dependencies
        working-directory: backend/services/analytics
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Run API tests
        working-directory: backend
        run: npm run test:api

      - name: Run gateway tests
        working-directory: backend
        run: npm run test:gateway

      - name: Debug GitHub identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1