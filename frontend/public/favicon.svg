<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>

    <!-- Chain / Flow Link Gradient -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Center Glow Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="2" fill="none" />

  <!-- Ambient Glow in Center -->
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)" />

  <!-- Interlocking Diagonal Link -->
  <g transform="translate(32, 32) rotate(-45)" stroke="url(#linkGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Loop -->
    <path d="M -4, -6.5 H -12 A 6.5 6.5 0 0 0 -12 6.5 H -4" />
    <!-- Connecting Link -->
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#38bdf8" stroke-width="5.5" />
    <!-- Right Loop -->
    <path d="M 4, -6.5 H 12 A 6.5 6.5 0 0 1 12 6.5 H 4" />
  </g>

  <!-- Small Energy Spark / Dot -->
  <circle cx="48" cy="16" r="2.5" fill="#38bdf8" />
</svg>